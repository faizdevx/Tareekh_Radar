[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tareekh-radar"
version = "0.1.0"
description = "Explainable detection of unusual adjournment and non-progress patterns in court hearing records (research tool)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "faizdevx" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "duckdb>=1.0",
    "pyarrow>=15",
    "pyyaml>=6",
    "openpyxl>=3.1",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.36",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tareekh = "tareekh_radar.cli:main"

[tool.setuptools.packages.find]
include = ["tareekh_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
